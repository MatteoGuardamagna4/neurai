[project]
name = "neurotutorsim"
version = "0.1.0"
description = "NeuroTutorSim: matched educational corpus (Phase I skeleton) and synthetic learner engine with Minitaur + LLM tutor (Phase III)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=16",
    "pyyaml>=6",
    "requests>=2.31",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/neurotutorsim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
