# Specification curve (brief §10.4, PLAN.md S13): every defensible modelling choice, each level ranked by
# theoretical plausibility BEFORE any year-10 result exists (1 = the main specification, 2 = a plausible
# alternative, 3 = the least plausible). A specification's tier is the highest rank among its levels.
# Status: written 2026-09-18 from PLAN.md S13 and approved by the user the same day, before any Phase V result existed.
status: approved
approved: 2026-09-18      # approved by the user before any Phase V result existed (brief §10.4)

# Post hoc levels change only how TRIBE feeds plasticity or how outcomes are weighted: they are evaluated on the saved
# accumulators (mean_accumulator_diff, accumulators_subsample), so they multiply the curve at no simulation cost.
post_hoc:
  reading_speed_wpm:                      # §6.2: 220 is the brief's main speed, 180 / 260 its robustness arms
    220: 1
    180: 2
    260: 2
  network_weights:                        # eq. 7: area weights are the brief's main analysis
    area: 1
    equal: 2
  parcellation:                           # §6.4 / §10.4; added 2026-09-20 (PLAN.md D24), ranks fixed before it was
    schaefer400: 1                        # computed. 400 is the run's atlas (D12); 200 re-aggregates the SAME saved
    schaefer200: 2                        # vertex predictions (scripts/reparcellate.py), so only the map differs.
  tribe_metric:                           # eq. 28 input: AUC is what the brief standardises
    auc: 1
    mean: 2                               # duration-free, so a check on AUC's length dependence
    peak: 3                               # one smoothed second: the noisiest summary
  winsorize:                              # §8.2: winsorised main, unwinsorised robustness
    yes: 1
    no: 2
  plasticity_mechanism:                   # §8.6: the hybrid D is the brief's main specification
    D: 1
    A: 2
    B: 2
    C: 2
  outcome_weights:                        # eq. 39: equal weights main, stakeholder weights in sensitivity (A9)
    equal: 1
    learning_first: 2
    autonomy_first: 2

# Rerun levels change the simulated behaviour: one Phase V run per combination, 2 x 4 x 3 x 3 x 3 = 216 runs.
# The `adaptation: authored` level carries no tag suffix, so the 72 runs made before that dimension existed ARE its
# 72 cells and are reused; only the 144 `halved` / `none` cells need new runs.
reruns:
  update_form:                            # PLAN.md D3: soft limits main; the literal eq. 22/23/25 pin states at bounds
    bounded: 1
    brief: 3
  forgetting:                             # PLAN.md D4 / A3
    weekly_break_0.25: 1                  # --break-scale 0.25 (main)
    weekly_break_0.1: 2                   # --break-scale 0.1
    weekly_break_1.0: 2                   # --break-scale 1.0: the break forgets at the full term rate
    per_episode_no_breaks: 3              # --set calendar.break_weeks=0
  exposure_per_week:                      # §9.1: three per week main, one and five the brief's alternatives
    3: 1
    1: 2
    5: 2
  effort_function:                        # eq. 19
    drawn: 1                              # a1-a4 drawn per parameter draw (the main uncertainty treatment)
    fixed_low: 2                          # --set effort.a1=0.9 effort.a2=0.6 effort.a3=0.7 effort.a4=1.5
    fixed_high: 2                         # --set effort.a1=1.5 effort.a2=1.0 effort.a3=1.3 effort.a4=2.5
  adaptation:                             # eq. 20 f_3 input: `support.adaptation` per protocol (PLAN.md D25).
    authored: 1                           # 0.35 / 0.90 / 0.20 as authored: brief §3.3 rates traditional adaptation
                                          # "None", scaffolding "High", substitution "High" but with the answer given.
                                          # This is the ONLY term separating scaffolding from traditional in eq. 20,
                                          # so the curve must show whether G's sign depends on it.
    halved: 2                             # each protocol half its distance from the three-protocol mean (0.4833):
                                          # 0.42 / 0.69 / 0.34 - the same ordering, half the advantage.
    none: 3                               # all three at 0.48: adaptation removed as a channel while the mean level of
                                          # F is preserved, so only the CONTRAST is switched off. Least plausible
                                          # because it contradicts the brief's own §3.3 table, hence rank 3.

learner_engine: >-
  logistic only at year 10; the hybrid (Centaur) engine appears only in the 30-episode engine comparison (S7),
  stated as a limitation, not a level of the curve. Running Centaur inside Phase V is infeasible by orders of
  magnitude (about 1.2e9 episodes at 4-15 s each); its behaviour reaches Phase V only through the fitted
  free-choice rule (D18).
design:
  draws: 50
  learners: 300
  years: 10
  # Pinned so a restarted batch cannot silently change what a cell runs. This is the config's full list, which is
  # what the D25 cells are running. The 72 pre-D25 cells ran the same list WITHOUT `free_choice_centaur`, whose rule
  # was fitted after them (D18), so that scenario exists only at the `halved` and `none` adaptation levels.
  # `analysis.spec_curve_g` therefore restricts the curve to the scenarios every cell has: a scenario present in only
  # some levels would confound the adaptation dimension with which cells happened to include it. To put
  # `free_choice_centaur` on the curve, all 216 cells must run it, i.e. the 72 authored cells must be re-run.
  scenarios: [traditional, scaffolding_rapid, scaffolding_nofade, substitution, free_choice, free_choice_centaur]
outputs:                                  # the two panels of Figure 8; each reports the runs actually on disk
  - year-10 G, every AI scenario vs traditional (216 reruns x 3 outcome weights = 648 specifications; 216 before
    the adaptation dimension is run)
  - year-10 mechanism-D control-network d, substitution vs traditional (216 reruns x 288 post hoc = 62,208 with
    both parcellations; halve for one atlas, and a third of that before the adaptation dimension is run)
