# Specification curve (brief §10.4, PLAN.md S13): every defensible modelling choice, each level ranked by
# theoretical plausibility BEFORE any year-10 result exists (1 = the main specification, 2 = a plausible
# alternative, 3 = the least plausible). A specification's tier is the highest rank among its levels.
# Status: written 2026-09-18 from PLAN.md S13 and approved by the user the same day, before any Phase V result existed.
status: approved
approved: 2026-09-18      # approved by the user before any Phase V result existed (brief §10.4)

# Post hoc levels change only how TRIBE feeds plasticity or how outcomes are weighted: they are evaluated on the saved
# accumulators (mean_accumulator_diff, accumulators_subsample), so they multiply the curve at no simulation cost.
post_hoc:
  reading_speed_wpm:                      # §6.2: 220 is the brief's main speed, 180 / 260 its robustness arms
    220: 1
    180: 2
    260: 2
  network_weights:                        # eq. 7: area weights are the brief's main analysis
    area: 1
    equal: 2
  tribe_metric:                           # eq. 28 input: AUC is what the brief standardises
    auc: 1
    mean: 2                               # duration-free, so a check on AUC's length dependence
    peak: 3                               # one smoothed second: the noisiest summary
  winsorize:                              # §8.2: winsorised main, unwinsorised robustness
    yes: 1
    no: 2
  plasticity_mechanism:                   # §8.6: the hybrid D is the brief's main specification
    D: 1
    A: 2
    B: 2
    C: 2
  outcome_weights:                        # eq. 39: equal weights main, stakeholder weights in sensitivity (A9)
    equal: 1
    learning_first: 2
    autonomy_first: 2

# Rerun levels change the simulated behaviour: one Phase V run per combination, 2 x 4 x 3 x 3 = 72 runs.
reruns:
  update_form:                            # PLAN.md D3: soft limits main; the literal eq. 22/23/25 pin states at bounds
    bounded: 1
    brief: 3
  forgetting:                             # PLAN.md D4 / A3
    weekly_break_0.25: 1                  # --break-scale 0.25 (main)
    weekly_break_0.1: 2                   # --break-scale 0.1
    weekly_break_1.0: 2                   # --break-scale 1.0: the break forgets at the full term rate
    per_episode_no_breaks: 3              # --set calendar.break_weeks=0
  exposure_per_week:                      # §9.1: three per week main, one and five the brief's alternatives
    3: 1
    1: 2
    5: 2
  effort_function:                        # eq. 19
    drawn: 1                              # a1-a4 drawn per parameter draw (the main uncertainty treatment)
    fixed_low: 2                          # --set effort.a1=0.9 effort.a2=0.6 effort.a3=0.7 effort.a4=1.5
    fixed_high: 2                         # --set effort.a1=1.5 effort.a2=1.0 effort.a3=1.3 effort.a4=2.5

learner_engine: >-
  logistic only at year 10; the hybrid (Centaur) engine appears only in the 30-episode engine comparison (S7),
  stated as a limitation, not a level of the curve.
design: {draws: 50, learners: 300, years: 10}
outputs:                                  # the two panels of Figure 8
  - year-10 G, every AI scenario vs traditional (72 reruns x 3 outcome weights = 216 specifications)
  - year-10 mechanism-D control-network d, substitution vs traditional (72 reruns x 144 post hoc = 10,368)
