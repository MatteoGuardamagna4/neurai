# Every number the report quotes, where it comes from and how to recompute it. `uv run python report/verify.py`
# checks them all and writes report/build/claims_check.md. One entry per claim:
#   where: report file; says: the text exactly as the report writes it; near: a phrase in the same paragraph
#   and one source:
#     from + row + col (+ fmt, scale, regex): a cell of outputs/tables/<from>
#     cfg (+ file, fmt): a value of config/default.yaml (or another YAML) by dotted path
#     expr (+ fmt): a Python expression over T(), row(), cfg(), js(), runs(), regex(), glob
#     code + contains: a file and a snippet one of its lines must contain (for statements about code or records)
# fmt is a Python format spec ("{:.2f}", "{:.0%}", "{:,}") or "sci" for "4.5 \times 10^{10}".

